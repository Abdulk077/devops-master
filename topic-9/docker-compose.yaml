version: '3.8'

services:
  app1:
    build: .
    networks:
      - mynet

  app2:
    build: .
    networks:
      - mynet

  app3:
    build: .
    networks:
      - mynet

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - mynet

networks:
  mynet:

